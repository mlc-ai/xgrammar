name: Update tokenizer asset revisions

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

concurrency:
  group: update-tokenizer-assets
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    if: github.repository == 'mlc-ai/xgrammar' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hub client
        run: python -m pip install "huggingface_hub>=1.2,<2"

      - name: Check tracked revisions
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/update_tokenizer_revisions.py

      - name: Create or update revision PR
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: ci/update-tokenizer-assets
          commit-message: Update pinned tokenizer asset revisions
          title: 'ci: update pinned tokenizer asset revisions'
          body-path: .ci/tokenizer-update.md
          add-paths: tests/tokenizer_assets.json
          draft: true

      # GITHUB_TOKEN-created commits/PRs do not trigger ordinary push/PR workflows.
      # Dispatch explicitly on the update branch; results attach to its head commit.
      - name: Run offline unit tests for changed revisions
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation
          == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run unit_test.yaml --ref ci/update-tokenizer-assets
