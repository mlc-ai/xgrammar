on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre_check:
    name: Pre-check on Ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Ruff check
        uses: astral-sh/ruff-action@v3

  prepare_tokenizers:
    needs: [pre_check]
    name: Prepare tokenizer assets once
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select asset set
        id: mode
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore portable tokenizer bundle
        id: assets
        uses: actions/cache@v4
        with:
          path: .ci/tokenizer-assets.zip
          key: tokenizer-assets-v1-${{ steps.mode.outputs.has_token }}-${{ hashFiles('tests/tokenizer_assets.json',
            'scripts/prepare_tokenizer_assets.py') }}

      - name: Prepare missing tokenizer bundle
        if: steps.assets.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DOWNLOAD_TIMEOUT: 60
        run: |
          python -m pip install "huggingface_hub>=1.2,<2"
          python scripts/prepare_tokenizer_assets.py

      - name: Share tokenizer bundle with test jobs
        uses: actions/upload-artifact@v4
        with:
          name: tokenizer-assets
          path: .ci/tokenizer-assets.zip
          retention-days: 1
          if-no-files-found: error

  run_unit_test:
    needs: [pre_check, prepare_tokenizers]
    env:
      XGRAMMAR_TOKENIZER_ASSETS: ${{ github.workspace }}/.ci/tokenizer-assets
      HF_HUB_OFFLINE: "1"
      XGRAMMAR_TEST_OFFLINE: "1"
    name: Run unit tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-14, macos-15-intel]
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.14t']
        include:
          # Native Windows ARM64 PyTorch wheels are available for Python 3.11-3.13.
          - {os: windows-11-vs2026-arm, python: '3.11'}
          - {os: windows-11-vs2026-arm, python: '3.12'}
          - {os: windows-11-vs2026-arm, python: '3.13'}
        exclude:
          - os: macos-14
            python: '3.14t'
          - os: macos-15-intel
            python: '3.13'
          - os: macos-15-intel
            python: '3.14'
          - os: macos-15-intel
            python: '3.14t'
            # The reason for the exclusion is that pytorch distribution
            # can't be found by pip on macos-15-intel with python 3.13.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download prepared tokenizer bundle
        uses: actions/download-artifact@v4
        with:
          name: tokenizer-assets
          path: .ci

      - name: Extract tokenizer bundle
        run: python -m zipfile -e .ci/tokenizer-assets.zip .ci/tokenizer-assets

      - name: Use LLVM clang 17 on macOS
        if: matrix.os == 'macos-15-intel'
        run: |
          brew update
          brew install llvm@17
          echo "CC=$(brew --prefix llvm@17)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm@17)/bin/clang++" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@17)/bin" >> "$GITHUB_PATH"
          clang++ --version

      - name: Install PyTorch on Windows ARM64
        if: matrix.os == 'windows-11-vs2026-arm'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build xgrammar from source
        run: |
          echo "set(XGRAMMAR_BUILD_CXX_TESTS ON)" >> cmake/config.cmake
          echo "set(XGRAMMAR_ENABLE_INTERNAL_CHECK ON)" >> cmake/config.cmake
          python -m pip install --upgrade pip
          # CMake >= 4.2 fixes FindPython ABI checks for free-threaded Python.
          pip install -v ".[test]" ${{ matrix.python == '3.14t' && '-C "cmake.version=>=4.2"' || '' }}

      # Test with MLX (which is optional) under macOS arm64
      - name: Install MLX
        if: matrix.os == 'macos-14' && !endsWith(matrix.python, 't')
        run: |
          # Keep the transformers bound in sync with pyproject.toml.
          pip install mlx-lm "transformers>=4.38.0"

      - name: Run C++ tests
        run: |
          ctest --test-dir build -V --timeout 30 --stop-on-failure

      - name: Run Python tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DOWNLOAD_TIMEOUT: 60
        if: env.HF_TOKEN != ''
        run: |
          pytest

      - name: Run Python tests without HF_TOKEN
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        if: env.HF_TOKEN == ''
        run: |
          pytest -m "not hf_token_required"

      - name: Run tests under pytest-run-parallel
        env:
          PYTHON_GIL: 0
        if: matrix.python == '3.14t'
        run: |
          python -m pip install pytest-run-parallel
          pytest -m "not hf_token_required" --parallel-threads=8
