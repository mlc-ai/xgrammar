on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre_check:
    name: Pre-check on Ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Ruff check
        uses: astral-sh/ruff-action@v3

  run_rust_test:
    needs: [pre_check]
    name: Run Rust tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # apache-tvm-ffi provides tvm-ffi-config and libtvm_ffi. Keep the
      # version in lockstep with the tvm-ffi revision pinned in
      # rust/Cargo.toml: the Rust crate and libxgrammar_bindings must link
      # the same libtvm_ffi ABI.
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install apache-tvm-ffi==0.1.12 cmake ninja

      - name: Build the bindings library
        run: |
          # Explicit interpreter: FindPython does not follow PATH, and the
          # tvm_ffi CMake discovery must use the environment set up above.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPython_EXECUTABLE="$(which python)"
          cmake --build build --target xgrammar_bindings

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format check
        working-directory: rust
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: rust
        run: cargo test

      - name: Run the example
        working-directory: rust
        run: cargo run --example constrained_decoding

  run_unit_test:
    needs: [pre_check]
    name: Run unit tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-14, macos-15-intel]
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.14t']
        exclude:
          - os: macos-14
            python: '3.14t'
          - os: macos-15-intel
            python: '3.13'
          - os: macos-15-intel
            python: '3.14'
          - os: macos-15-intel
            python: '3.14t'
            # The reason for the exclusion is that pytorch distribution
            # can't be found by pip on macos-15-intel with python 3.13.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Cache huggingface
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
          key: huggingface-${{ matrix.os }}-python-${{ matrix.python }}

      - name: Use LLVM clang 17 on macOS
        if: matrix.os == 'macos-15-intel'
        run: |
          brew update
          brew install llvm@17
          echo "CC=$(brew --prefix llvm@17)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm@17)/bin/clang++" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@17)/bin" >> "$GITHUB_PATH"
          clang++ --version

      - name: Build xgrammar from source
        run: |
          echo "set(XGRAMMAR_BUILD_CXX_TESTS ON)" >> cmake/config.cmake
          echo "set(XGRAMMAR_ENABLE_INTERNAL_CHECK ON)" >> cmake/config.cmake
          python -m pip install --upgrade pip
          pip install -v ".[test]"

      # Test with MLX (which is optional) under macOS arm64
      - name: Install MLX
        if: matrix.os == 'macos-14' && !endsWith(matrix.python, 't')
        run: |
          # Keep the transformers bound in sync with pyproject.toml.
          pip install mlx-lm "transformers>=4.38.0"

      - name: Run C++ tests
        run: |
          ctest --test-dir build -V --timeout 30 --stop-on-failure

      - name: Run Python tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DOWNLOAD_TIMEOUT: 60
        if: env.HF_TOKEN != ''
        run: |
          pytest

      - name: Run Python tests without HF_TOKEN
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        if: env.HF_TOKEN == ''
        run: |
          pytest -m "not hf_token_required"

      - name: Run tests under pytest-run-parallel
        env:
          PYTHON_GIL: 0
        if: matrix.python == '3.14t'
        run: |
          python -m pip install pytest-run-parallel
          pytest -m "not hf_token_required" --parallel-threads=8
