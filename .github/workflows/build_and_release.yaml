name: Build and upload to PyPI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  prepare_version:
    name: Determine package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4

      - name: Resolve version and validate release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          args=()
          publish=false
          if [[ "$EVENT_NAME" == "release" || ( "$EVENT_NAME" == "workflow_dispatch" && "$REF_TYPE" == "tag" ) ]]; then
            args=(--tag "$RELEASE_TAG")
            publish=true
          fi
          version=$(uv run --no-project --python 3.12 --with 'scikit-build-core>=0.10.0' --with 'setuptools-scm>=9.2.2' python scripts/get_version.py "${args[@]}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  test_version:
    name: Test packaging helpers on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Test version resolution and distribution validation
        run: uv run --no-project --python '${{ matrix.python }}' --with 'scikit-build-core>=0.10.0' --with
          'setuptools-scm>=9.2.2' --with pytest python -m pytest scripts/tests

  build_wheels:
    needs: [prepare_version, test_version]
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, arch: x86_64, build: 'cp*-manylinux*'}
          - {os: ubuntu-24.04-arm, arch: aarch64, build: 'cp*-manylinux*'}
          - {os: windows-latest, arch: AMD64, build: 'cp*'}
          - {os: windows-11-vs2026-arm, arch: ARM64, build: 'cp*'}
          - {os: macos-14, arch: arm64, build: 'cp*'}
          - {os: macos-15-intel, arch: x86_64, build: 'cp*',}

    steps:
      - uses: astral-sh/setup-uv@v4

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Use LLVM clang 17 on macOS
        if: matrix.os == 'macos-15-intel' && matrix.arch == 'x86_64'
        run: |
          brew update
          brew install llvm@17
          echo "CC=$(brew --prefix llvm@17)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm@17)/bin/clang++" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@17)/bin" >> "$GITHUB_PATH"
          clang++ --version

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_TEST_SKIP: '*'
          CIBW_BUILD_VERBOSITY: 1
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_XGRAMMAR: ${{ needs.prepare_version.outputs.version }}
          CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_XGRAMMAR

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.arch }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    needs: [prepare_version, test_version]
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4

      - name: Build sdist
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_XGRAMMAR: ${{ needs.prepare_version.outputs.version }}
        run: uv tool run --from build pyproject-build --sdist

      - name: Check metadata
        run: pipx run twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [prepare_version, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: needs.prepare_version.outputs.publish == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - uses: actions/download-artifact@v4
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Verify all distribution versions
        env:
          EXPECTED_VERSION: ${{ needs.prepare_version.outputs.version }}
        run: uv run --no-project --python 3.12 --with packaging python scripts/check_dist.py dist --version
          "$EXPECTED_VERSION"

      - name: Generate artifact attestation for sdist and wheels
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          skip-existing: true
          verbose: true
          # repository-url: https://test.pypi.org/legacy/
          # To test: repository-url: https://test.pypi.org/legacy/
