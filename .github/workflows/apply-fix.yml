name: apply-converter-fix
on:
  push:
    paths: ['.github/workflows/apply-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-property-names-additional
      - name: Diagnose and apply
        run: |
          out=$(git apply --verbose fix_core.patch 2>&1); a=$?
          echo "::error::apply_exit=$a out=$out" 
          if [ $a -ne 0 ]; then exit 1; fi
          git config user.name "liangqianxing"
          git config user.email "113435208+liangqianxing@users.noreply.github.com"
          git add cpp/json_schema_converter.cc
          cout=$(git commit -m "fix(json_schema): propertyNames gate fix" 2>&1); c=$?
          echo "::error::commit_exit=$c out=$cout"
          if [ $c -ne 0 ]; then exit 1; fi
          pout=$(git push "https://x-access-token:${{ github.token }}@github.com/liangqianxing/xgrammar.git" HEAD:fix-property-names-additional 2>&1); p=$?
          echo "::error::push_exit=$p out=$pout"
          if [ $p -ne 0 ]; then exit 1; fi
          echo "::notice::ALL_OK"
