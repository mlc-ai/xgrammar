name: apply-converter-fix
on:
  push:
    paths: ['.github/workflows/apply-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: clone-apply-commit-push
        env:
          TOKEN: ${{ github.token }}
          PATCH_B64: 
        run: |
          set -e
          echo "$PATCH_B64" | base64 -d > /tmp/fix.patch
          git clone --depth 1 --branch fix-property-names-additional "https://x-access-token:${TOKEN}@github.com/liangqianxing/xgrammar.git" repo
          cd repo
          git apply --verbose /tmp/fix.patch
          grep -n 'property_names && additional_property' cpp/json_schema_converter.cc
          git config user.name "liangqianxing"
          git config user.email "113435208+liangqianxing@users.noreply.github.com"
          git add cpp/json_schema_converter.cc
          git commit -m "fix(json_schema): propertyNames must not preserve a permissive additional-property rule (fixes #961)"
          git push "https://x-access-token:${TOKEN}@github.com/liangqianxing/xgrammar.git" HEAD:fix-property-names-additional
