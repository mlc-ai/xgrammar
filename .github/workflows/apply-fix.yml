name: apply-converter-fix
on:
  push:
    paths: ['.github/workflows/apply-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-property-names-additional
      - name: Apply fix and upload via gh api
        run: |
          git config --global --add safe.directory '*'
          git apply --verbose fix_core.patch
          git diff --stat
          B64=$(base64 -w0 cpp/json_schema_converter.cc)
          SHA=$(curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/liangqianxing/xgrammar/contents/cpp/json_schema_converter.cc?ref=fix-property-names-additional | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          curl -s -X PUT -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/liangqianxing/xgrammar/contents/cpp/json_schema_converter.cc -d '{"message":"fix(json_schema): propertyNames must not preserve a permissive additional-property rule (fixes #961)","content":"'"$B64"'","sha":"'"$SHA"'","branch":"fix-property-names-additional"}'
      - name: Verify remote file
        run: |
          curl -s https://raw.githubusercontent.com/liangqianxing/xgrammar/fix-property-names-additional/cpp/json_schema_converter.cc | grep -n 'property_names && additional_property'
