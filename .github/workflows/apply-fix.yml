name: apply-converter-fix
on:
  push:
    paths: ['.github/workflows/apply-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-property-names-additional
      - name: Diagnose and apply
        run: |
          set -x
          git status
          git remote -v
          git apply --verbose fix_core.patch
          echo "apply_exit=$?"
          git diff --stat
          git add cpp/json_schema_converter.cc
          git commit -m "fix(json_schema): propertyNames must not preserve a permissive additional-property rule (fixes #961)"
          b=$?; echo "commit_exit=$b"
          git show --stat HEAD | head -6
          git push "https://x-access-token:${{ github.token }}@github.com/liangqianxing/xgrammar.git" HEAD:fix-property-names-additional
          p=$?; echo "push_exit=$p"
          test $p -eq 0
